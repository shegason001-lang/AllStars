<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Registration - All Stars Football Club</title>

  <link rel="stylesheet" href="styles.css">
    <style>
/* Management Registration page layout fix */

body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

header { 
  width: 100%;
  box-sizing: border-box;
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.site-logo {
  width: 65px !important;
  height: 65px !important;
  max-width: 65px !important;
  object-fit: contain;
}

header nav {
  max-width: 1100px;
  margin: 0 auto;
  padding: 10px 25px;
}

.hero {
  max-width: 1100px;
  margin: 0 auto;
  padding: 35px 20px;
  text-align: center;
}

.hero-logo {
  width: 100px !important;
  height: 100px !important;
  max-width: 100px !important;
  object-fit: contain;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  box-sizing: border-box;
}

.form-section {
  max-width: 850px;
  margin: 30px auto;
  padding: 30px;
  box-sizing: border-box;
}

form {
  width: 100%;
}

form input,
form select,
form textarea {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

@media (max-width: 700px) {

  .header-inner {
    padding: 12px 15px;
  }

  .site-logo {
    width: 50px !important;
    height: 50px !important;
    max-width: 50px !important;
  }

  .hero-logo {
    width: 75px !important;
    height: 75px !important;
    max-width: 75px !important;
  }

  .form-section {
    margin: 15px;
    padding: 20px;
  }

}
</style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="header-inner">

    <img
      src="all-stars-logo.jpeg"
      alt="All Stars Football Club Logo"
      class="site-logo"
    >

    <div>
      <h1>ALL STARS FOOTBALL CLUB</h1>
      <p>Management Registration</p>
    </div>

  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="player-registration.html">Player Registration</a>
    <a href="management-registration.html">Management Registration</a>
    <a href="players.html">Players</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>


<main class="container">

  <section class="hero">
    <img
      src="all-stars-logo.jpeg"
      alt="All Stars FC"
      class="hero-logo"
    >

    <h2>Management Registration</h2>

    <p>
      Register as a member of the All Stars Football Club management team.
    </p>
  </section>


  <section class="form-section">

   <form id="managementForm" enctype="multipart/form-data">

      <h2>Personal Information</h2>

      <label>
       <input
  type="text"
  id="full_name"
  name="full_name"
  required
>
      </label>


      <label>
        Passport Photograph *
       <input
  type="file"
  id="passport"
  name="passport"
  accept="image/jpeg,image/png,image/webp"
  required
>
      </label>

      <div id="photoPreview"></div>


      <label>
        Date of Birth
        <input
          type="date"
          id="date_of_birth"
        >
      </label>


      <label>
        Gender
        <select id="gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </label>


      <h2>Management Information</h2>

      <label>
        Management Role *
     <select id="role" name="role" required>

          <option value="">
            Select Management Role
          </option>

          <option value="Chairman">
            Chairman
          </option>

          <option value="Vice Chairman">
            Vice Chairman
          </option>

          <option value="Secretary">
            Secretary
          </option>

          <option value="Assistant Secretary">
            Assistant Secretary
          </option>

          <option value="Treasurer">
            Treasurer
          </option>

          <option value="Financial Secretary">
            Financial Secretary
          </option>

          <option value="Public Relations Officer">
            Public Relations Officer
          </option>

          <option value="Team Manager">
            Team Manager
          </option>

          <option value="Coach">
            Coach
          </option>

          <option value="Assistant Coach">
            Assistant Coach
          </option>

          <option value="Welfare Officer">
            Welfare Officer
          </option>

          <option value="Other">
            Other
          </option>

        </select>
      </label>


      <label>
       <input
  type="tel"
  id="phone"
  name="phone"
  required
>
      </label>


      <label>
        WhatsApp Number
        <input
          type="tel"
          id="whatsapp"
        >
      </label>


      <label>
        Email Address
        <input
          type="email"
          id="email"
        >
      </label>


      <label>
        Residential Address *
        <textarea
          id="address"
          rows="3"
          required
        ></textarea>
      </label>


      <label>
        Management Experience
        <textarea
          id="experience"
          rows="4"
          placeholder="Describe your football or management experience..."
        ></textarea>
      </label>


      <label>
        Qualifications
        <textarea
          id="qualifications"
          rows="4"
          placeholder="Enter relevant qualifications, certificates or training..."
        ></textarea>
      </label>


      <h2>Emergency Contact</h2>

      <label>
        Emergency Contact Name
        <input
          type="text"
          id="emergency_name"
        >
      </label>


      <label>
        Emergency Contact Phone
        <input
          type="tel"
          id="emergency_phone"
        >
      </label>


      <label>
        Other Information
        <textarea
          id="other_information"
          rows="4"
          placeholder="Any additional information..."
        ></textarea>
      </label>


      <button
        type="submit"
        class="btn"
        id="submitBtn"
      >
        Submit Management Registration
      </button>

      <div id="message"></div>

    </form>

  </section>

</main>


<script>
const form = document.getElementById("managementForm");
const message = document.getElementById("message");
const passport = document.getElementById("passport");
const photoPreview = document.getElementById("photoPreview");

passport.addEventListener("change", () => {
  const file = passport.files[0];

  if (!file) {
    photoPreview.innerHTML = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function (e) {
    photoPreview.innerHTML = `
      <img
        src="${e.target.result}"
        alt="Passport Preview"
        style="
          width:150px;
          height:180px;
          object-fit:cover;
          border-radius:8px;
          margin:10px 0;
        "
      >
    `;
  };

  reader.readAsDataURL(file);
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  message.innerHTML = "";

  const submitBtn = document.getElementById("submitBtn");

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    const formData = new FormData(form);

    const response = await fetch("/api/register/management", {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Registration failed.");
    }

    message.innerHTML = `
      <div style="
        padding:20px;
        margin-top:20px;
        border-radius:10px;
        background:#e8f5e9;
      ">
        <h3>Registration Successful!</h3>

        <p>
          Your management registration has been submitted successfully.
        </p>

        <p>
          <strong>Status:</strong> Pending
        </p>

        <p>
          Your registration will be reviewed by the club management.
        </p>
      </div>
    `;

    form.reset();
    photoPreview.innerHTML = "";

  } catch (error) {
    console.error(error);

    message.innerHTML = `
      <p style="color:red;">
        Registration failed: ${error.message}
      </p>
    `;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Management Registration";
  }
});
</script>
</body>
</html>
